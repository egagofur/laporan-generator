# Preset: Universitas Indonesia (UI)
preset_id: "ui-skripsi"
name: "Universitas Indonesia (UI)"
description: "Format Tugas Akhir & Skripsi sesuai Pedoman Penulisan Karya Ilmiah Universitas Indonesia."

# Margin halaman (Standar UI: Top 2.5cm / 2cm, Left 2.5cm, Bottom 2.5cm / 3cm, Right 2.5cm)
margin_top: 2.5cm
margin_bottom: 2.5cm
margin_left: 2.5cm
margin_right: 2.5cm

# Tipografi
font_family: "Libertinus Serif"
font_size: 12pt
line_spacing: 0.75em
first_line_indent: 1.25cm

# Penomoran Heading
heading_chapter_prefix: "BAB "
heading_chapter_num_format: "roman"
heading_sub_dot: true
heading_subsub_dot: false

# Pengaturan Cover
cover_show_lecturer: true
cover_logo_width: 4cm
